<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A Look Back at Earth album cover project by Christopher von Spitzer"
    />
    <title>A Look Back at Earth — Christopher von Spitzer</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <main class="project-page">
      <nav class="site-nav page-shell" aria-label="Project navigation">
        <a class="site-nav__home" href="index.html">Christopher von Spitzer</a>
        <a class="site-nav__next" href="studio.html">Studio project <span aria-hidden="true">↗</span></a>
      </nav>

      <header class="project-hero page-shell">
        <p class="eyebrow">01 / Album cover</p>
        <h1>A Look Back<br />at Earth</h1>
        <div class="project-details">
          <p>Les Baxter</p>
          <p>Individual project</p>
          <p>AI for Interdisciplinary Design<br />Arizona State University</p>
        </div>
      </header>

      <section class="project-section page-shell" aria-labelledby="final-cover-heading">
        <div class="project-section__heading">
          <p class="eyebrow">Final outcome</p>
          <h2 id="final-cover-heading">Album cover</h2>
        </div>
        <figure class="media-figure media-figure--portrait">
          <picture>
            <source srcset="assets/images/final_cover_album-web.jpg" type="image/jpeg" />
            <img
              src="assets/images/final_cover_album.png"
              alt="Final album cover with the title and artist lettering angled along the rocket’s path"
            />
          </picture>
          <figcaption>
            The completed cover follows the rocket’s upward path with angled title and artist
            lettering, a looping three-color trail, and a dense star field.
          </figcaption>
        </figure>
      </section>

      <section class="project-section page-shell" aria-labelledby="album-process-heading">
        <div class="project-section__heading">
          <p class="eyebrow">Process</p>
          <h2 id="album-process-heading">Developing the composition</h2>
        </div>
        <div class="process-grid process-grid--three">
          <figure class="media-figure">
            <img
              src="assets/images/cover-first-prompt.png"
              alt="Initial album-cover composition with a rocket leaving Earth"
              loading="lazy"
            />
            <figcaption>
              The initial prompt established the rocket’s departure from Earth toward a vivid red
              planet.
            </figcaption>
          </figure>
          <figure class="media-figure">
            <img
              src="assets/images/cover-ribbon-loop.png"
              alt="Album-cover process image introducing a looping ribbon trail"
              loading="lazy"
            />
            <figcaption>
              The exhaust trail was refined into a controlled three-color ribbon with a single loop.
            </figcaption>
          </figure>
          <figure class="media-figure">
            <img
              src="assets/images/cover-stars.png"
              alt="Album-cover process image with an expanded field of stars"
              loading="lazy"
            />
            <figcaption>
              A denser star field and adjusted spacing brought the final atmosphere into focus.
            </figcaption>
          </figure>
        </div>
      </section>

      <nav class="project-footer page-shell" aria-label="Continue browsing">
        <a href="index.html"><span aria-hidden="true">←</span> Home</a>
        <a href="studio.html">Next: Laughter Yoga Studio 2036 <span aria-hidden="true">→</span></a>
      </nav>
    </main>
  </body>
</html>
